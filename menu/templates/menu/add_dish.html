{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block head_title %}Add Dish - The Heart of Ruritania{% endblock %}

{% block main %}

<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card-body">
                <h1>{{ course.name }}</h1>
                <h2>Add a Dish</h2>
                <form id="dishForm" method="post">
                    {{ dish_form | crispy }}
                    {% csrf_token %}
                    <button id="submitButton" type="submit" class="btn btn-primary btn-lg">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
